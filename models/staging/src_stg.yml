version: 2

sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    tables:
      - name: CUSTOMERS
        columns:
          - name: customer_id
            tests:
              - not_null
              - unique
      - name: ORDERS
        freshness:
          warn_after:
            count: 12
            period: hour
          error_after: 
            count: 24
            period: hour
        loaded_at_field: _ETL_LOADED_AT